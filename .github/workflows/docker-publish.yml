name: Release & Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch   # 1.2.3 → 1.2.4
          - minor   # 1.2.3 → 1.3.0
          - major   # 1.2.3 → 2.0.0
        default: patch
      release_notes:
        description: "Release notes (optional — auto-changelog is always appended)"
        required: false
        type: string
        default: ""

env:
  IMAGE: rajeshvg/astradb-performance-go

# ── Job 1: calculate the next version and create the git tag ──────────────────
jobs:
  tag:
    name: "1 · Bump version & create tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag:     ${{ steps.next.outputs.tag }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: next
        run: |
          # Find the highest existing vX.Y.Z tag; default to v0.0.0 on first run.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          LATEST=${LATEST:-v0.0.0}
          echo "Current latest tag: ${LATEST}"

          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: ${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"    >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.tag }}" \
                  -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

# ── Job 2: build one image per architecture in parallel ───────────────────────
# Produces two arch-specific tags:
#   rajeshvg/astradb-performance-go:amd64-1.0.1
#   rajeshvg/astradb-performance-go:arm64-1.0.1
  build:
    name: "2 · Build ${{ matrix.arch }}-${{ needs.tag.outputs.version }}"
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (required for arm64 cross-compilation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          # Tag format: amd64-1.0.1 or arm64-1.0.1
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}-${{ needs.tag.outputs.version }}
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Separate cache keys per arch to avoid cross-contamination.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

# ── Job 3: bump VERSION in .env.example and commit ───────────────────────────
  update-env:
    name: "3 · Update .env.example VERSION"
    runs-on: ubuntu-latest
    needs: [tag, build]
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set VERSION in .env
        run: |
          sed -i "s/^VERSION=.*/VERSION=${{ needs.tag.outputs.version }}/" .env

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .env
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump VERSION to ${{ needs.tag.outputs.version }}"
          git push origin main

# ── Job 4: create the GitHub Release ─────────────────────────────────────────
  release:
    name: "4 · Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [tag, build]
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name:     ${{ needs.tag.outputs.tag }}
          body: |
            ${{ inputs.release_notes }}

            ---

            ## Option A — cassperf only (bring your own Cassandra / Astra DB)

            Pull and run a single container. Point the UI at any reachable Cassandra node or Astra DB.

            ```bash
            # ARM64 — Apple Silicon (M1 / M2 / M3)
            docker pull ${{ env.IMAGE }}:arm64-${{ needs.tag.outputs.version }}
            docker run -d --name cassperf -p 3000:3000 -p 9090:9090 \
              ${{ env.IMAGE }}:arm64-${{ needs.tag.outputs.version }}

            # AMD64 — Intel / AMD
            docker pull ${{ env.IMAGE }}:amd64-${{ needs.tag.outputs.version }}
            docker run -d --name cassperf -p 3000:3000 -p 9090:9090 \
              ${{ env.IMAGE }}:amd64-${{ needs.tag.outputs.version }}
            ```

            Open **http://localhost:3000** and enter your connection details.

            ---

            ## Option B — full stack (cassperf + Cassandra + Prometheus + Grafana)

            Download the compose file once, then start everything:

            ```bash
            # ARM64
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.tag.outputs.tag }}/docker-compose.yml \
              -o docker-compose.yml
            ARCH=arm64 VERSION=${{ needs.tag.outputs.version }} docker compose up -d

            # AMD64
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.tag.outputs.tag }}/docker-compose.yml \
              -o docker-compose.yml
            ARCH=amd64 VERSION=${{ needs.tag.outputs.version }} docker compose up -d
            ```

            | Service | URL |
            |---|---|
            | cassperf UI + API | http://localhost:3000 |
            | Grafana dashboard | http://localhost:3001 (admin / admin) |
            | Prometheus | http://localhost:9091 |
            | Cassandra | localhost:9042 |

            ---

            ## ⬆️ Upgrade (Option B only)

            ```bash
            ARCH=arm64 VERSION=${{ needs.tag.outputs.version }} docker compose pull cassperf
            ARCH=arm64 VERSION=${{ needs.tag.outputs.version }} docker compose up -d cassperf
            ```
          draft: false
          prerelease: false
          generate_release_notes: true

